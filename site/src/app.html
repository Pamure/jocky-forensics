<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="JOCKY — a forensic scripting language and runtime (SIH26148): install it, learn the language, run host triage, build polymorphic artifacts, execute filelessly and manage many hosts from one console."
		/>
		<meta name="color-scheme" content="dark light" />
		%sveltekit.head%
		<script>
			// Apply the stored theme before first paint so there is no flash.
			(function () {
				try {
					var stored = localStorage.getItem('jocky-theme');
					var prefersLight =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
					document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
				} catch (error) {
					document.documentElement.dataset.theme = 'dark';
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
