name: polymorphism

# The CI/CD half of the polymorphic engine: every push must show that 256
# builds of one script are byte-unique *and* still equivalent to the source.
# The gate therefore runs on the same script twice over — as a freshness claim
# (unique hashes) and as a correctness claim (findings equal to a source run).

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  # A superseded push has nothing to say about the current tree; cancel it.
  group: polymorphism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polymorphism:
    name: polymorphic build gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        # A stall here used to cost the whole 6-hour job cap before anyone saw a
        # result: the suite hung on a FIFO under the runner's /tmp (fixed in
        # jocky/rt/filefs.py) and the only symptom was a job that never
        # finished. The suite takes ~3 minutes on this runner, so 20 is already
        # ten times the budget and a hang now reports itself in minutes.
        timeout-minutes: 20
        run: python -m pytest tests/ -q -o addopts=""

      # A number in prose must be reproducible by a command. This repository
      # once carried a commit title claiming "108 DFIR solutions" while the tree
      # held 15, and nothing failed because nothing was counting. This step is
      # that counter: it fails the build when a live document states a count the
      # tree contradicts.
      - name: Claims audit
        run: |
          python tools/claims_audit.py -v
          python tools/claims_audit.py >> "$GITHUB_STEP_SUMMARY"

      # --markdown prints the step-summary table and nothing else, so one gate
      # run both decides the verdict (non-zero exit on FAIL) and produces the
      # summary file.  The redirect happens either way: a failing gate still
      # publishes the numbers that say why.
      - name: Polymorphic build + equivalence gate
        run: |
          python -m jocky ci --script scripts/hunt.jky --count 256 --markdown > summary.md

      - name: Publish step summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Evidence, not just a colour: the JSON report (when the CLI writes one)
      # and the markdown table are kept even when the gate failed, and a
      # missing optional path must not turn a red gate into a confusing one.
      - name: Upload polymorphism report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymorphism-report
          path: |
            summary.md
            ci-report.json
            artifacts/
          if-no-files-found: ignore
          retention-days: 14
